<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HumptyDumpty — Rusty Toolz</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <a class="back" href="/">← Rusty Toolz</a>
  <h1>🥚 HumptyDumpty</h1>
  <p>Static malware triage. Point it at a sample and it cracks it open into hashes, PE/ELF facts, per-section entropy, suspicious imports, and carved IOCs — without ever running it. Pairs with FluShot: decrypt a sample in your VM, then triage it here.</p>
</header>
<main>
  <form id="hd-form">
    <label>
      File to analyze
      <span class="hint">Absolute path to the sample on this machine. Static analysis only — it never executes the file — but the file is still live malware, so do this inside your VM.</span>
      <input type="text" id="file" name="file" placeholder="C:\samples\suspicious.exe" autocomplete="off" spellcheck="false">
    </label>
    <label class="toggle">
      <input type="checkbox" id="strings" name="strings">
      Also print notable strings (keyword-matched)
    </label>
    <div class="button-row">
      <button type="submit" id="run-btn">Analyze</button>
      <button type="button" id="stop-btn" class="stop" hidden>Stop</button>
      <button type="button" id="clear-btn" class="stop">Clear</button>
      <button type="button" id="download-btn" class="stop" hidden>Download Summary</button>
    </div>
  </form>
  <div class="panel">
    <h2>Triage</h2>
    <pre id="output" class="log-panel"></pre>
  </div>
</main>
<script src="/panel.js"></script>
<script>
  const form = document.getElementById('hd-form');
  const fileInput = document.getElementById('file');
  const stringsInput = document.getElementById('strings');
  const output = document.getElementById('output');
  const runBtn = document.getElementById('run-btn');
  const stopBtn = document.getElementById('stop-btn');
  const clearBtn = document.getElementById('clear-btn');
  const downloadBtn = document.getElementById('download-btn');
  let source = null;
  let capturedLines = [];
  let analyzedFile = '';

  function setRunning(running) {
    runBtn.disabled = running;
    runBtn.textContent = running ? 'Analyzing…' : 'Analyze';
    stopBtn.hidden = !running;
  }

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    if (!fileInput.value.trim()) return;
    if (source) source.close();
    clearPanel(output);
    capturedLines = [];
    analyzedFile = fileInput.value.trim();
    downloadBtn.hidden = true;
    setRunning(true);

    const params = new URLSearchParams();
    params.set('file', analyzedFile);
    if (stringsInput.checked) params.set('strings', '1');

    source = new EventSource('/humptydumpty/run?' + params.toString());
    source.onmessage = (e) => {
      capturedLines.push(e.data);
      appendLine(output, e.data);
      downloadBtn.hidden = false; // summary is available as soon as there's output
    };
    source.addEventListener('done', () => { setRunning(false); source.close(); });
    source.onerror = () => { setRunning(false); source.close(); };
  });

  stopBtn.addEventListener('click', () => {
    stopBtn.disabled = true;
    fetch('/humptydumpty/stop', { method: 'POST' }).finally(() => { stopBtn.disabled = false; });
  });

  clearBtn.addEventListener('click', () => {
    clearPanel(output);
    capturedLines = [];
    downloadBtn.hidden = true;
  });

  downloadBtn.addEventListener('click', () => {
    const base = (analyzedFile.split(/[\\/]/).pop() || 'sample').replace(/[^A-Za-z0-9._-]/g, '_');
    const header = [
      'HumptyDumpty — Static Triage Summary',
      'Target:    ' + (analyzedFile || '(unknown)'),
      'Generated: ' + new Date().toString(),
      '='.repeat(60),
      '',
    ].join('\n');
    const footer = '\n\n' + '='.repeat(60) +
      '\nGenerated by HumptyDumpty (Rusty Toolz) — static analysis only; the sample was never executed.\n';
    const blob = new Blob([header + capturedLines.join('\n') + footer], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'humptydumpty-' + base + '-summary.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
</script>
</body>
</html>
